name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/textile/aiscreenbridge
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AIScreenBridge"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.textile.aiscreenbridge"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.textile.aiscreenbridge"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
          }

          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AI Screen Bridge</string>
              <string name="accessibility_description">AI Screen Bridge lit le texte visible pour aider avec une IA.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#222222</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewTextChanged|typeViewClicked|typeViewFocused"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="500"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="false"
              android:canTakeScreenshot="false"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"/>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="AI Screen Bridge"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ScreenAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/textile/aiscreenbridge/MainActivity.kt <<'EOF'
          package com.textile.aiscreenbridge

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("config", MODE_PRIVATE)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(32, 42, 32, 32)

                  val title = TextView(this)
                  title.text = "AI Screen Bridge"
                  title.textSize = 24f
                  title.gravity = Gravity.CENTER

                  val info = TextView(this)
                  info.text = "L'app lit le texte visible avec Accessibilite puis l'envoie a OpenAI ou Claude quand tu appuies sur la bulle AI."
                  info.textSize = 15f
                  info.setPadding(0, 20, 0, 20)

                  val provider = Spinner(this)
                  provider.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, listOf("OpenAI / ChatGPT", "Anthropic / Claude"))
                  provider.setSelection(prefs.getInt("providerIndex", 0))

                  val apiKey = EditText(this)
                  apiKey.hint = "Cle API"
                  apiKey.setSingleLine(true)
                  apiKey.setText(prefs.getString("apiKey", ""))

                  val model = EditText(this)
                  model.hint = "Modele"
                  model.setSingleLine(true)
                  model.setText(prefs.getString("model", "gpt-4.1-mini"))

                  val userPrompt = EditText(this)
                  userPrompt.hint = "Demande a l'IA"
                  userPrompt.minLines = 3
                  userPrompt.setText(prefs.getString("userPrompt", "Lis le contexte de mon ecran et dis-moi la prochaine action a faire."))

                  val status = TextView(this)
                  status.text = "Enregistre, autorise la bulle, puis active l'accessibilite."
                  status.setPadding(0, 20, 0, 0)

                  val save = Button(this)
                  save.text = "Enregistrer"
                  save.setOnClickListener {
                      prefs.edit()
                          .putInt("providerIndex", provider.selectedItemPosition)
                          .putString("apiKey", apiKey.text.toString().trim())
                          .putString("model", model.text.toString().trim())
                          .putString("userPrompt", userPrompt.text.toString().trim())
                          .apply()
                      status.text = "Configuration enregistree."
                  }

                  val overlay = Button(this)
                  overlay.text = "Autoriser la bulle flottante"
                  overlay.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                  }

                  val access = Button(this)
                  access.text = "Activer l'accessibilite"
                  access.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }

                  root.addView(title)
                  root.addView(info)
                  root.addView(provider)
                  root.addView(apiKey)
                  root.addView(model)
                  root.addView(userPrompt)
                  root.addView(save)
                  root.addView(overlay)
                  root.addView(access)
                  root.addView(status)
                  setContentView(root)
              }
          }
          EOF

          cat > app/src/main/java/com/textile/aiscreenbridge/ScreenAccessibilityService.kt <<'EOF'
          package com.textile.aiscreenbridge

          import android.accessibilityservice.AccessibilityService
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.TextView
          import kotlinx.coroutines.*

          class ScreenAccessibilityService : AccessibilityService() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private var lastContext = ""
              private var wm: WindowManager? = null
              private var bubble: Button? = null
              private var result: TextView? = null
              private var lastSentAt = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  createOverlay()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val root = rootInActiveWindow ?: return
                  val text = ScreenTextExtractor.extract(root)
                  if (text.isNotBlank()) lastContext = PrivacyFilter.clean(text).take(5000)
              }

              override fun onInterrupt() {}

              private fun createOverlay() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      WindowManager.LayoutParams.TYPE_PHONE

                  bubble = Button(this)
                  bubble?.text = "AI"
                  bubble?.setOnClickListener { askAi() }

                  result = TextView(this)
                  result?.text = "AI Screen Bridge actif"
                  result?.setPadding(16, 12, 16, 12)
                  result?.visibility = View.GONE
                  result?.setBackgroundColor(0xEEFFFFFF.toInt())

                  try {
                      wm?.addView(bubble, WindowManager.LayoutParams(160, 160, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                          gravity = Gravity.TOP or Gravity.END
                          x = 25
                          y = 240
                      })
                      wm?.addView(result, WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                          gravity = Gravity.BOTTOM
                          y = 80
                      })
                  } catch (_: Exception) {}
              }

              private fun askAi() {
                  if (System.currentTimeMillis() - lastSentAt < 3000) return
                  lastSentAt = System.currentTimeMillis()

                  if (lastContext.isBlank()) {
                      show("Aucun texte lisible detecte.")
                      return
                  }

                  val prefs = getSharedPreferences("config", MODE_PRIVATE)
                  val key = prefs.getString("apiKey", "") ?: ""
                  val model = prefs.getString("model", "gpt-4.1-mini") ?: "gpt-4.1-mini"
                  val prompt = prefs.getString("userPrompt", "") ?: ""

                  if (key.isBlank()) {
                      show("Ajoute ta cle API dans l'application.")
                      return
                  }

                  show("Analyse IA en cours...")
                  scope.launch {
                      val answer = if (prefs.getInt("providerIndex", 0) == 0)
                          OpenAiClient.ask(key, model, prompt, lastContext)
                      else
                          ClaudeClient.ask(key, model, prompt, lastContext)
                      show(answer)
                  }
              }

              private fun show(text: String) {
                  result?.visibility = View.VISIBLE
                  result?.text = text.take(1500)
              }
          }
          EOF

          cat > app/src/main/java/com/textile/aiscreenbridge/ScreenTextExtractor.kt <<'EOF'
          package com.textile.aiscreenbridge

          import android.view.accessibility.AccessibilityNodeInfo

          object ScreenTextExtractor {
              fun extract(root: AccessibilityNodeInfo): String {
                  val out = StringBuilder()
                  walk(root, out, 0)
                  return out.toString()
              }

              private fun walk(node: AccessibilityNodeInfo?, out: StringBuilder, depth: Int) {
                  if (node == null || depth > 30) return
                  val text = node.text?.toString()?.trim()
                  val desc = node.contentDescription?.toString()?.trim()
                  val id = node.viewIdResourceName?.substringAfterLast("/") ?: ""
                  if (!text.isNullOrBlank()) out.appendLine("Texte: $text")
                  if (!desc.isNullOrBlank() && desc != text) out.appendLine("Description: $desc")
                  if (id.isNotBlank()) out.appendLine("Element: $id")
                  for (i in 0 until node.childCount) walk(node.getChild(i), out, depth + 1)
              }
          }
          EOF

          cat > app/src/main/java/com/textile/aiscreenbridge/PrivacyFilter.kt <<'EOF'
          package com.textile.aiscreenbridge

          object PrivacyFilter {
              fun clean(input: String): String {
                  var t = input
                  t = t.replace(Regex("\\b\\d{16}\\b"), "**** **** **** ****")
                  t = t.replace(Regex("(?i)(password|mot de passe|mdp|passcode|code secret)\\s*[:=]?\\s*\\S+"), "$1: ********")
                  t = t.replace(Regex("(?i)(api[_ -]?key|token|bearer)\\s*[:=]?\\s*\\S+"), "$1: ********")
                  t = t.replace(Regex("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"), "[email masque]")
                  return t
              }
          }
          EOF

          cat > app/src/main/java/com/textile/aiscreenbridge/OpenAiClient.kt <<'EOF'
          package com.textile.aiscreenbridge

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody
          import okhttp3.MediaType.Companion.toMediaType
          import org.json.JSONArray
          import org.json.JSONObject

          object OpenAiClient {
              private val client = OkHttpClient()
              private val mediaType = "application/json; charset=utf-8".toMediaType()

              suspend fun ask(apiKey: String, model: String, userPrompt: String, screenContext: String): String = withContext(Dispatchers.IO) {
                  try {
                      val body = JSONObject()
                          .put("model", model.ifBlank { "gpt-4.1-mini" })
                          .put("input", JSONArray()
                              .put(JSONObject().put("role", "system").put("content", "Reponds en francais simple avec une action claire."))
                              .put(JSONObject().put("role", "user").put("content", "$userPrompt\n\nCONTEXTE ECRAN:\n$screenContext"))
                          )

                      val req = Request.Builder()
                          .url("https://api.openai.com/v1/responses")
                          .addHeader("Authorization", "Bearer $apiKey")
                          .post(RequestBody.create(mediaType, body.toString()))
                          .build()

                      client.newCall(req).execute().use { res ->
                          val raw = res.body?.string() ?: ""
                          if (!res.isSuccessful) return@withContext "Erreur OpenAI: ${res.code}\n$raw"
                          val output = JSONObject(raw).optJSONArray("output") ?: return@withContext raw.take(1000)
                          val text = StringBuilder()
                          for (i in 0 until output.length()) {
                              val content = output.getJSONObject(i).optJSONArray("content") ?: continue
                              for (j in 0 until content.length()) text.append(content.getJSONObject(j).optString("text"))
                          }
                          text.toString().ifBlank { raw.take(1000) }
                      }
                  } catch (e: Exception) {
                      "Erreur OpenAI: ${e.message}"
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/textile/aiscreenbridge/ClaudeClient.kt <<'EOF'
          package com.textile.aiscreenbridge

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody
          import okhttp3.MediaType.Companion.toMediaType
          import org.json.JSONArray
          import org.json.JSONObject

          object ClaudeClient {
              private val client = OkHttpClient()
              private val mediaType = "application/json; charset=utf-8".toMediaType()

              suspend fun ask(apiKey: String, model: String, userPrompt: String, screenContext: String): String = withContext(Dispatchers.IO) {
                  try {
                      val body = JSONObject()
                          .put("model", model.ifBlank { "claude-sonnet-4-5" })
                          .put("max_tokens", 700)
                          .put("system", "Reponds en francais simple avec une action claire.")
                          .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", "$userPrompt\n\nCONTEXTE ECRAN:\n$screenContext")))

                      val req = Request.Builder()
                          .url("https://api.anthropic.com/v1/messages")
                          .addHeader("x-api-key", apiKey)
                          .addHeader("anthropic-version", "2023-06-01")
                          .post(RequestBody.create(mediaType, body.toString()))
                          .build()

                      client.newCall(req).execute().use { res ->
                          val raw = res.body?.string() ?: ""
                          if (!res.isSuccessful) return@withContext "Erreur Claude: ${res.code}\n$raw"
                          val content = JSONObject(raw).optJSONArray("content") ?: return@withContext raw.take(1000)
                          val text = StringBuilder()
                          for (i in 0 until content.length()) text.append(content.getJSONObject(i).optString("text"))
                          text.toString().ifBlank { raw.take(1000) }
                      }
                  } catch (e: Exception) {
                      "Erreur Claude: ${e.message}"
                  }
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Screen-Bridge-APK
          path: app/build/outputs/apk/debug/app-debug.apk
